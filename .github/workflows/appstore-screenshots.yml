name: App Store screenshots

# Uploads the marketing panels of screenshots/appstore/<lang>/ to App Store Connect.
# Called by release-ios.yml on every tag, and runnable on its own when the panels
# change outside a release (or when a release shipped without them).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: appstore-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: 🖼️ App Store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
          working-directory: infra

      - name: Install the App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Upload the panels
        working-directory: infra
        # The version has to be editable: a version already in review refuses new
        # screenshots, so this runs before the submission, not after it.
        run: bundle exec fastlane ios screenshots
